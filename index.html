<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ICT Unit 2 – Digital Safety Game</title><meta name="color-scheme" content="dark">
<style>
:root{--bg:#0a1240;--c:#17206b;--n:#38bdf8;--p:#a855f7;--g:#22c55e;--o:#fb923c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html,body{margin:0;background:var(--bg);color:#fff;font:17px/1.4 system-ui,Arial,sans-serif}
body{background:radial-gradient(circle at 20% 10%,#2b2f9a,transparent 50%),radial-gradient(circle at 80% 90%,#6d28d9,transparent 50%),var(--bg);background-attachment:fixed;overflow-x:hidden}
#app{max-width:520px;margin:auto;padding:12px;position:relative}
.st{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 120px 90px,#7dd3fc,transparent),radial-gradient(3px 3px at 200px 40px,#fde047,transparent);background-size:240px 140px;animation:tw 4s infinite alternate;opacity:.5}
@keyframes tw{to{opacity:.15;transform:translateY(8px)}}@keyframes bob{50%{transform:translateY(-8px)}}
.card{background:var(--c);border:2px solid #4f5bd5;border-radius:18px;padding:14px;margin:10px 0}
img.cover{width:100%;border-radius:16px;border:3px solid var(--p);box-shadow:0 0 22px var(--p)}
button,select,input{font:inherit;min-height:48px;border-radius:14px;border:0;width:100%;margin:5px 0;padding:8px 12px}
button{background:linear-gradient(90deg,var(--n),var(--p));color:#fff;font-weight:700;cursor:pointer}
button.o{background:#27318f;text-align:left;border:2px solid #4f5bd5}
button.ok{background:var(--g)!important;border-color:#fff}button.no{background:var(--o)!important;opacity:.85}button:disabled{opacity:.7}
.bar{height:12px;background:#0a1240;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#fde047)}
.bot{font-size:46px;display:inline-block;animation:bob 2s infinite}h2,h3{margin:6px 0}
#fb{font-weight:700;margin:8px 0}.col{display:flex;align-items:flex-end;gap:10px;height:130px}.col div{flex:1;text-align:center;font-size:13px}.col i{display:block;background:linear-gradient(0deg,var(--p),var(--n));border-radius:8px 8px 0 0}
.cert{background:#fff;color:#1a1a4a;border:8px double #a855f7;border-radius:12px;text-align:center;padding:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fde047;color:#000;padding:10px 16px;border-radius:12px;z-index:9}
@media print{.st,button,.np,#toast{display:none!important}body{background:#fff;color:#000}.card{background:#fff;border-color:#000}}
</style></head><body><div class="st"></div><div id="app"></div>

let S;try{S=JSON.parse(localStorage.ict4u2)}catch(e){}S=S||{name:'',L:{}};
const sv=()=>{try{localStorage.ict4u2=JSON.stringify(S)}catch(e){}};
let snd=1,ac,g=Math.floor(Math.random()*4),cur,a,ci,done,ca,q;
const sh=x=>x.map(v=>[Math.random(),v]).sort((p,r)=>p[0]-r[0]).map(v=>v[1]);
const beep=(f,d=.15)=>{if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),n=ac.createGain();o.frequency.value=f;n.gain.value=.1;o.connect(n);n.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};
const toast=m=>{const d=document.createElement('div');d.id='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2200)};
const lv=p=>p>=90?'ICT Champion 🏆':p>=75?'Excellent Progress ⭐':p>=60?'Good Progress 👍':'Keep Practising 💪';
const pc=l=>{const L=S.L[l];return L&&L.done?Math.round(L.latest/L.max*100):0};
function start(){A.innerHTML=`<img class=cover src="${IMG}" alt="Eng. Nihal Badawy ICT Grade 4"><h2 style="text-align:center">ENG.NIHAL BADAWY – ICT GRADE 4</h2><div class=card><span class=bot>🤖</span> <b>Welcome, Young ICT Engineer!</b><p>Are you ready to explore, discover, and become an ICT Champion?</p><input id=nm placeholder="Type your name here" maxlength=30 value="${S.name}"><button onclick="go()">START GAME ▶</button><button class=o onclick="snd=!snd;this.textContent=snd?'🔊 Sound ON':'🔇 Sound OFF'">🔊 Sound ON</button><small>Your scores are saved on this browser and device only. They do not move to other phones.</small></div><p style="text-align:center">THINK • CREATE • INNOVATE</p>`}
function go(){const v=$('#nm').value.trim();if(!v)return toast('Please type your name first');S.name=v;sv();beep(660);dash()}
function dash(){let h=`<div class=card><span class=bot>🤖</span> Hello, <b>${S.name}</b>! Pick a mission.</div>`;
for(let l=1;l<=3;l++){const L=S.L[l]||{},n=Q[l].length,pr=L.done?100:L.prog?Math.round(L.prog.res.length/n*100):0;
h+=`<div class=card style="border-color:${T[l][2]}"><h3>${T[l][1]} Lesson ${l}: ${T[l][0]}</h3><small>${T[l][3]} · ${n} questions</small><br>Latest: ${L.done?L.latest+'/'+L.max:'–'} · Best: ${L.done?L.best+'/'+L.max:'–'}<br>${L.done?'✅ Completed':L.prog?'⏳ In progress':'🆕 Not started'}<div class=bar><i style="width:${pr}%"></i></div><button style="background:${T[l][2]}" onclick="ql(${l})">${L.done?'PLAY AGAIN':L.prog?'CONTINUE':'START LESSON'}</button>${L.done?`<button class=o onclick="rep(${l},1)">View my result</button>`:''}</div>`}
A.innerHTML=h+`<button onclick="fin3()">UNIT 2 FINAL REPORT 📊</button><button class=o onclick="csv()">Export scores (CSV)</button><button class=o onclick="start()">Change name / sound</button>`}
function ql(l){const L=S.L[l]=S.L[l]||{};if(!L.prog)L.prog={o:sh(Q[l].map((_,i)=>i)),i:0,res:[]};cur=L.prog;cur.l=l;cur.i=cur.res.length;sv();showQ()}
function showQ(){const p=cur,l=p.l,n=p.o.length;if(p.i>=n)return finish();q=Q[l][p.o[p.i]];a=0;done=0;
const pts=p.res.reduce((s,r)=>s+r.p,0),ok=p.res.filter(r=>r.p>0).length;
let h=`<div class=card style="border-color:${T[l][2]}"><b>${T[l][3]}</b><br>Question ${p.i+1} of ${n} · ⭐ ${pts} pts · ✅ ${ok} · ❌ ${p.res.length-ok}<div class=bar><i style="width:${p.i/n*100}%"></i></div></div><div class=card>`;
const t=q[0];let body='';
if(t=='m'||t=='t'||t=='b'){let o;if(t=='m'){o=sh(q[3]);ci=(g++)%4;o.splice(ci,0,q[2])}else if(t=='t'){o=['True','False'];ci=q[2]?0:1}else{o=q[3];ci=q[4]}
ca=o[ci];body=`<p><b>${q[1]}</b></p>`+o.map((x,i)=>`<button class=o onclick="pick(${i})">${t=='m'?String.fromCharCode(65+i)+'. ':''}${x}</button>`).join('')}
else if(t=='x'){const r=sh(q[2].map(x=>x[1]));ca=q[2].map(x=>x[0]+' → '+x[1]).join('; ');body=`<p><b>${q[1]}</b></p>`+q[2].map((x,j)=>`${x[0]}<select id=s${j}><option value="">Choose…</option>${r.map(y=>`<option>${y}</option>`).join('')}</select>`).join('')+`<button onclick="chkX()">CHECK ✔</button>`}
else{ca=q[2].join(' → ');body=`<p><b>${q[1]}</b></p><div id=sq class=card>Tap the steps in order…</div>`+sh(q[2]).map(x=>`<button class=o onclick="add(this)">${x}</button>`).join('')+`<button onclick="chkO()">CHECK ✔</button><button class=o onclick="showQ()">Reset</button>`}
if(q[4]==1&&t=='m')body=`<button onclick="this.nextSibling.hidden=0;this.hidden=1;beep(520)">🃏 Tap to flip the safety card</button><div hidden>${body}</div>`;
A.innerHTML=h+body+`<div id=fb></div></div>`;window.seq=[]}
function fb(m,cls){$('#fb').innerHTML=m}
function pick(i){if(done)return;const b=document.querySelectorAll('.o')[i];if(i==ci){b.classList.add('ok');fin(a?1:2)}else{b.classList.add('no');b.disabled=true;a++;if(a<2){beep(200);fb('🟠 Not quite. Try again!')}else{document.querySelectorAll('.o')[ci].classList.add('ok');fin(0)}}}
function chkX(){if(done)return;const s=q[2].map((x,j)=>$('#s'+j));if(s.some(e=>!e.value))return toast('Choose an answer for every item');if(s.every((e,j)=>e.value==q[2][j][1]))return fin(a?1:2);a++;if(a<2){beep(200);fb('🟠 Some matches are wrong. Try again!')}else{s.forEach((e,j)=>e.value=q[2][j][1]);fin(0)}}
function add(b){if(done||b.disabled)return;b.disabled=true;seq.push(b.textContent);$('#sq').textContent=seq.join(' → ')}
function chkO(){if(done)return;if(seq.length<q[2].length)return toast('Tap all the steps first');if(seq.join()==q[2].join())return fin(a?1:2);a++;if(a<2){beep(200);fb('🟠 Not the right order. Press Reset and try again!');}else fin(0)}
function fin(p){done=1;document.querySelectorAll('button.o,select').forEach(e=>e.disabled=true);cur.res.push({q:q[1],a:ca,p});sv();beep(p?880:260,.25);
const last=cur.res.length>=cur.o.length;$('#fb').innerHTML=(p==2?'🌟 Correct! +2 points':p?'✅ Correct on your second try! +1 point':`💡 Let’s learn from it. Correct answer: <u>${ca}</u>. +0`)+`<button onclick="cur.i++;showQ()">${last?'SEE MY REPORT 🏆':'NEXT ▶'}</button>`}
function finish(){const l=cur.l,r=cur.res,L=S.L[l],pts=r.reduce((s,x)=>s+x.p,0);L.latest=pts;L.best=Math.max(L.best||0,pts);L.max=r.length*2;L.done=1;L.date=new Date().toLocaleDateString();L.att=r;L.prog=null;sv();rep(l)}
function rep(l,x){const L=S.L[l],r=L.att,n=r.length,c1=r.filter(z=>z.p==2).length,c2=r.filter(z=>z.p==1).length,w=r.filter(z=>!z.p),p=pc(l);
A.innerHTML=`<div class=card style="border-color:${T[l][2]}"><h2>📋 ${S.name}</h2><b>${T[l][0]}</b><p>Questions: ${n}<br>✅ Correct first try: ${c1}<br>🔁 Correct after reattempt: ${c2}<br>❌ Incorrect: ${w.length}<br>Final score: <b>${L.latest}/${L.max}</b> (${p}%) · Best: ${L.best}/${L.max}<br><b>${lv(p)}</b></p><div class=bar><i style="width:${p}%"></i></div></div><div class=card><b>Learning analysis</b><p>${c1?`You understood ${c1} idea(s) really well on the first try. `:''}${w.length?`Please practise again: ${w.map(z=>'“'+z.q+'”').join(', ')}`:'You answered every question correctly. Fantastic!'}</p></div><div id=rv></div><button onclick="rv(${l})">REVIEW MY MISTAKES</button><button onclick="ql2(${l})">TRY AGAIN</button><button onclick="sv();toast('Score saved on this device ✅')">SAVE MY SCORE</button><button class=o onclick="print()">Print my report 🖨️</button><button class=o onclick="dash()">BACK TO LESSON MENU</button>`}
function rv(l){const w=S.L[l].att.filter(z=>!z.p);$('#rv').innerHTML=`<div class=card>${w.length?w.map(z=>`<p>❌ ${z.q}<br>✅ <b>${z.a}</b></p>`).join(''):'No mistakes to review. 🎉'}</div>`}
function ql2(l){S.L[l].prog=null;ql(l)}
function fin3(){const d=[1,2,3].filter(l=>S.L[l]&&S.L[l].done),tp=d.reduce((s,l)=>s+S.L[l].latest,0),tm=d.reduce((s,l)=>s+S.L[l].max,0),p=tm?Math.round(tp/tm*100):0;
if(!d.length){toast('Finish a lesson first');return}
const bs=d.reduce((x,l)=>pc(l)>pc(x)?l:x),wk=d.reduce((x,l)=>pc(l)<pc(x)?l:x);
A.innerHTML=`<div class=card><h2>📊 Unit 2 Report</h2><b>${S.name}</b><p>Completed lessons: ${d.length}/3<br>Points: ${tp}/${tm} · Overall: <b>${p}%</b><br>${lv(p)}<br>Best lesson: ${bs} · Needs practice: ${wk}</p><div class=col>${[1,2,3].map(l=>`<div>${pc(l)}%<i style="height:${pc(l)}px;background:${T[l][2]}"></i>L${l}</div>`).join('')}</div></div><div class=card><b>Recommendations</b><p>${d.length<3?'Finish all three lessons to earn your certificate. ':''}${pc(wk)<90?`Practise Lesson ${wk} (${T[wk][0]}) again to improve. `:''}${pc(bs)>=90?`Great job on Lesson ${bs}! `:''}Keep using the Internet safely, kindly, and smartly.</p></div>${d.length==3?'<button onclick="cert()">🎓 MY CERTIFICATE</button>':''}<button class=o onclick="print()">Print report 🖨️</button><button class=o onclick="dash()">BACK TO LESSON MENU</button>`}
function cert(){const p=Math.round([1,2,3].reduce((s,l)=>s+S.L[l].latest,0)/[1,2,3].reduce((s,l)=>s+S.L[l].max,0)*100);
A.innerHTML=`<div class=cert><h3>ICT UNIT 2 – DIGITAL SAFETY AND SECURITY PRECAUTIONS</h3><p>Awarded to</p><h2 style="color:#7c3aed;font-size:30px">${S.name}</h2><p>For successfully completing all three ICT challenges.</p><p><b>${lv(p)}</b><br>Overall: ${p}%<br>Date: ${new Date().toLocaleDateString()}</p><b>ENG.NIHAL BADAWY – ICT GRADE 4</b><br><small>THINK • CREATE • INNOVATE</small></div><button onclick="print()">PRINT CERTIFICATE 🖨️</button><button class=o onclick="fin3()">Back</button>`}
function csv(){let t='Student,Lesson,Latest,Best,Max,Percent,Correct,Incorrect,Date\n';[1,2,3].forEach(l=>{const L=S.L[l];if(L&&L.done)t+=`"${S.name}","${T[l][0]}",${L.latest},${L.best},${L.max},${pc(l)},${L.att.filter(z=>z.p).length},${L.att.filter(z=>!z.p).length},${L.date}\n`});
try{const u=URL.createObjectURL(new Blob([t],{type:'text/csv'})),e=document.createElement('a');e.href=u;e.download='ict_unit2_scores.csv';e.click()}catch(e){}try{navigator.clipboard.writeText(t)}catch(e){}toast('CSV exported (also copied)')}
start();
</script></body></html>
